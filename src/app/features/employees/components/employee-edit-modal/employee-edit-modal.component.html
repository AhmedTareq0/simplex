<app-shared-modal
  [visible]="visible()"
  [title]="employee().id === 0 ? 'إضافة موظف جديد' : 'تعديل بيانات الموظف'"
  (closed)="cancel.emit()"
>
  <form [formGroup]="editForm" (ngSubmit)="onSubmit()" class="employee-form">
    <div class="employee-form__content">
      <!-- Image Upload Section -->
      <div class="employee-form__image-section">
        <div class="image-preview" [class.image-preview--empty]="!imagePreview()">
          @if (imagePreview()) {
            <img [src]="imagePreview()" alt="Employee Preview" />
          } @else {
            <app-icon name="user" class="placeholder-icon" />
          }
          <label class="image-upload-btn">
            <app-icon name="camera" />
            <span>تغيير الصورة</span>
            <input type="file" (change)="onImageSelected($event)" accept="image/*" hidden />
          </label>
        </div>
      </div>

      <div class="employee-form__fields">
        <div class="form-row">
          <app-shared-input
            label="الاسم بالكامل"
            placeholder="أدخل الاسم"
            formControlName="name"
            class="flex-1"
          />
          <app-shared-input
            label="اسم العرض"
            placeholder="الاسم الذي يظهر للنظام"
            formControlName="display_name"
            class="flex-1"
          />
        </div>

        <div class="form-row">
          <app-shared-input
            label="البريد الإلكتروني"
            type="email"
            placeholder="email@simplex.com"
            formControlName="email"
            class="flex-1"
          />
          <app-shared-input
            label="رقم الهاتف"
            placeholder="01xxxxxxxxx"
            formControlName="phone"
            class="flex-1"
          />
        </div>

        <div class="form-row">
          <app-shared-select
            label="القسم"
            [options]="departmentOptions"
            formControlName="department"
            class="flex-1"
          />
          <app-shared-select
            label="الدور الوظيفي"
            [options]="roleOptions"
            formControlName="employee_role"
            class="flex-1"
          />
        </div>
      </div>
    </div>

    <div class="employee-form__actions">
      <app-button
        label="إلغاء"
        variant="secondary"
        (pressed)="cancel.emit()"
        [disabled]="isSubmitting()"
      />
      <app-button
        [label]="isSubmitting() ? 'جاري الحفظ...' : 'حفظ البيانات'"
        type="submit"
        [loading]="isSubmitting()"
        [disabled]="editForm.invalid"
      />
    </div>
  </form>
</app-shared-modal>
