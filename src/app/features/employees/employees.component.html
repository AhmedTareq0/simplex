<div class="employees">
  <div class="employees__header">
    <div class="employees__info">
      <h1 class="employees__title">قائمه الموظفين</h1>
      <p class="employees__subtitle">إدارة بيانات وأدوار الموظفين والمهندسين في النظام</p>
    </div>
  </div>

  <div class="employees__tabs">
    @for (tab of tabs; track tab.value) {
      <button 
        class="tab-btn" 
        [class.active]="activeTab() === tab.value"
        (click)="setTab(tab.value)">
        {{ tab.label }}
      </button>
    }
  </div>

  @if (isLoading) {
  <div class="employees__skeleton">
    <app-skeleton-loader type="table" [count]="8" />
  </div>
  } @else {
  <app-shared-table [data]="filteredEmployees()" [columns]="columns" title="دليل الموظفين" [showView]="true" [showEdit]="false"
    [showDelete]="false" [showActions]="true" [lazy]="true" [totalRecords]="total" [rows]="pageSize()"
    [currentPage]="currentPage()" (onPageChange)="onPageChange($event)" (onView)="onRowClick($event)"
    (onRowClick)="onRowClick($event)" />
  }
</div>
