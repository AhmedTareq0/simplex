<div class="clients">
  <div class="clients__header">
    <div class="clients__info">
      <h1 class="clients__title">دليل العملاء</h1>
      <p class="clients__subtitle">إدارة بيانات العملاء والشركات المتعاقد معها</p>
    </div>
    <div class="clients__actions">
      @if (auth.isSuperAdmin()) {
        <app-button
          label="إضافة عميل"
          icon="plus"
          (pressed)="onAdd()"
        />
      }
    </div>
  </div>

  @if (isLoading) {
    <div class="clients__skeleton">
      <app-skeleton-loader type="table" [count]="8" />
    </div>
  } @else {
    <app-shared-table
      [data]="clients"
      [columns]="columns"
      title="قائمة العملاء"
      [showView]="true"
      [showEdit]="auth.isSuperAdmin()"
      [showDelete]="false"
      [showActions]="true"
      (onView)="onRowClick($event)"
      (onEdit)="onEdit($event)"
      (onRowClick)="onRowClick($event)"
    />
  }
</div>

@if (showDetailModal() && selectedClient()) {
  <app-client-detail
    [visible]="showDetailModal()"
    [client]="selectedClient()"
    (close)="showDetailModal.set(false)"
    (edit)="onEdit($event)"
  />
}

@if (showEditModal() && selectedClient()) {
  <app-client-edit-modal
    [visible]="showEditModal()"
    [client]="selectedClient()!"
    [isSubmitting]="isSubmitting()"
    (save)="handleSaveClient($event)"
    (cancel)="showEditModal.set(false)"
  />
}
