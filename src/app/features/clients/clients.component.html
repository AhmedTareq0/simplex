<div class="clients">
  <div class="clients__header">
    <div class="clients__info">
      <h1 class="clients__title">دليل العملاء</h1>
      <p class="clients__subtitle">إدارة بيانات العملاء والشركات المتعاقد معها</p>
    </div>
  </div>

  @if (isLoading) {
    <div class="clients__skeleton">
      <app-skeleton-loader type="table" [count]="8" />
    </div>
  } @else {
    <app-shared-table
      [data]="clients"
      [columns]="columns"
      title="قائمة العملاء"
      [showView]="true"
      [showEdit]="false"
      [showDelete]="false"
      [showActions]="true"
      [lazy]="true"
      [totalRecords]="total"
      [rows]="pageSize()"
      [currentPage]="currentPage()"
      (onPageChange)="onPageChange($event)"
      (onView)="onRowClick($event)"
      (onRowClick)="onRowClick($event)"
    />
  }
</div>
