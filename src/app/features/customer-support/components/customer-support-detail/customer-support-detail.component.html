<app-shared-modal [(visible)]="visible" [title]="user?.name || 'تفاصيل العميل'" [maxWidth]="'1100px'" [width]="'95vw'"
  [showCloseButton]="true" contentClass="!p-0" (closed)="close()">
  <div class="cd-split" *ngIf="user">

     <div class="cd-split__info">

      <!-- Avatar + Status -->
      <div class="cd-split__hero">
        <div class="cd-split__avatar">{{ user.name?.charAt(0) }}</div>
        <div class="cd-split__hero-text">
          <h2 class="cd-split__name">{{ user.name }}</h2>
          <span class="cd-split__status-badge" [style.backgroundColor]="getStatusColor(user.status) + '22'"
            [style.color]="getStatusColor(user.status)" [style.borderColor]="getStatusColor(user.status) + '44'">
            <span class="cd-split__dot" [style.backgroundColor]="getStatusColor(user.status)"></span>
            {{ getStatusLabel(user.status) }}
          </span>
        </div>
      </div>

      <!-- Info Fields -->
      <div class="cd-split__fields">
        <div class="cd-split__field-row">
          <span class="cd-split__field-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2" />
              <path d="M8 21h8M12 17v4" />
            </svg>
            المكنة
          </span>
          <span class="cd-split__field-value">{{ user.machine }}</span>
        </div>
        <div class="cd-split__field-row">
          <span class="cd-split__field-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
            تاريخ الزيارة
          </span>
          <span class="cd-split__field-value">{{ user.visitDate }}</span>
        </div>
        <div class="cd-split__field-row">
          <span class="cd-split__field-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z" />
            </svg>
            الأولوية
          </span>
          <span class="cd-split__priority" [class]="'cd-split__priority--' + user.priority">
            {{ getPriorityLabel(user.priority) }}
          </span>
        </div>
      </div>

      <!-- Delete Button -->
      <div class="cd-split__actions">
        <button class="cd-split__btn cd-split__btn--edit" (click)="onEdit()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
          </svg>
          تعديل
        </button>
        <button class="cd-split__btn cd-split__btn--danger" (click)="onDelete()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6l-1 14H6L5 6" />
            <path d="M10 11v6M14 11v6" />
            <path d="M9 6V4h6v2" />
          </svg>
          حذف العميل
        </button>
      </div>
    </div>

     <div class="cd-split__chat">
      <div class="cd-split__chat-header">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
        <span>المحادثة</span>
      </div>
      <div class="cd-split__chat-body">
        <app-chat-messages class="cd-split__chat-messages" [messages]="chatMessages" [currentUserId]="currentUserId" [users]="chatUsers" />
      </div>
    </div>

  </div>
</app-shared-modal>
