<app-shared-modal
  [(visible)]="visible"
  [title]="isEditMode ? 'تعديل بيانات العميل' : 'إنشاء عميل جديد'"
  [maxWidth]="'32rem'"
  (closed)="close()"
>
  <div class="customer-support-create__form">
    <app-shared-select
      label="الاسم"
      [options]="customerOptions"
      [(ngModel)]="newUser.name"
      optionLabel="label"
      optionValue="value"
      placeholder="اختر اسم العميل"
      [filter]="true"
      class="customer-support-create__field"
    ></app-shared-select>

    <app-shared-input
      label="المكنة"
      type="text"
      [(ngModel)]="newUser.machine"
      placeholder="أدخل رقم المكنة"
      class="customer-support-create__field"
    ></app-shared-input>

    <app-shared-input
      label="تاريخ الزيارة"
      type="date"
      [(ngModel)]="newUser.visitDate"
      class="customer-support-create__field"
    ></app-shared-input>

    <app-shared-select
      label="الحالة"
      [options]="statusOptions"
      [(ngModel)]="newUser.status"
      optionLabel="label"
      optionValue="value"
      placeholder="اختر الحالة"
      [showClear]="false"
      class="customer-support-create__field"
    ></app-shared-select>

    <app-shared-select
      label="الأولوية"
      [options]="priorityOptions"
      [(ngModel)]="newUser.priority"
      optionLabel="label"
      optionValue="value"
      placeholder="اختر الأولوية"
      [showClear]="false"
      class="customer-support-create__field"
    ></app-shared-select>

    <div class="customer-support-create__actions">
      <button
        class="customer-support-create__btn customer-support-create__btn--secondary"
        (click)="close()"
      >
        إلغاء
      </button>
      <button
        class="customer-support-create__btn customer-support-create__btn--primary"
        (click)="onSave()"
      >
        حفظ
      </button>
    </div>
  </div>
</app-shared-modal>
