<div class="chat-layout">
  <div class="chat-layout__left">
    @if (isLoading()) {
      <app-skeleton-loader type="chat-list" [count]="6" />
    } @else if (errorMessage()) {
      <div class="chat-error">
        <span>{{ errorMessage() }}</span>
        <button (click)="loadConversations()" class="btn-retry">إعادة المحاولة</button>
      </div>
    } @else {
      <app-chat-list
        [users]="users()"
        [total]="total()"
        [currentUserId]="currentUserId()"
        [accountPicture]="accountPicture()"
        [lastMessages]="lastMessages()"
        [selectedUserId]="selectedPerson()?.sub || ''"
        [unreadCounts]="unreadCounts()"
        (selectUser)="onSelectUser($event)"
        (search)="onSearch($event)"
        (filterChange)="onFiltersChange($event)"
        (loadMore)="loadMore()"
      />
    }
  </div>
  <div class="chat-layout__right">
    @if (selectedPerson()) {
      @if (isLoadingMessages()) {
        <app-skeleton-loader type="chat-message" [count]="8" />
      } @else if (messagesError()) {
        <div class="chat-error chat-error--messages">
          <span>{{ messagesError() }}</span>
          <button (click)="onSelectUser(selectedPerson()!)" class="btn-retry">إعادة المحاولة</button>
        </div>
      } @else {
        <app-chat-box
          [person]="selectedPerson()"
          [messages]="messages()"
          [currentUserId]="currentUserId()"
          [conversationId]="selectedPerson()?.sub || ''"
          [isOnline]="false"
          [isTyping]="isTyping()"
          [userName]="userData()?.name || ''"
          [users]="users()"
          (deleted)="onConversationDeleted($any($event))"
        />
      }
    } @else {
      <app-chat-empty />
    }
  </div>
</div>
