<div class="chat-footer">

  <!-- File preview bar -->
  @if (pendingFile()) {
    <div class="chat-footer__preview">
      <div class="chat-footer__preview-content">
        @if (pendingFilePreview()) {
          <img [src]="pendingFilePreview()!" class="chat-footer__preview-img" alt="preview" />
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
          </svg>
        }
        <span class="chat-footer__preview-name">{{ pendingFile()!.name }}</span>
      </div>
      <button class="chat-footer__preview-remove" (click)="clearPendingFile()" aria-label="إزالة الملف" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  }

  <!-- Input row -->
  <div class="chat-footer__row">

    <!-- Send / Mic button -->
    <button
      class="chat-footer__icon-btn"
      [class.chat-footer__icon-btn--send]="hasContent()"
      (click)="onSend()"
      type="button"
      [attr.aria-label]="hasContent() ? 'إرسال' : 'تسجيل صوتي'"
    >
      @if (hasContent()) {
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      }
    </button>

    <!-- Input area -->
    <div class="chat-footer__input-wrap">

      <!-- Emoji button -->
      <div class="chat-footer__emoji-wrap" #emojiPickerRef>
        <button
          class="chat-footer__emoji-btn"
          type="button"
          aria-label="إيموجي"
          (click)="toggleEmojiPicker($event)"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
            <line x1="9" y1="9" x2="9.01" y2="9"/>
            <line x1="15" y1="9" x2="15.01" y2="9"/>
          </svg>
        </button>

        @if (showEmojiPicker()) {
          <div class="chat-footer__emoji-picker-container" (click)="$event.stopPropagation()">
            <emoji-picker
              (emoji-click)="onEmojiClick($event)"
              class="chat-footer__emoji-picker"
            ></emoji-picker>
          </div>
        }
      </div>

      <input
        #inputRef
        class="chat-footer__input"
        type="text"
        [placeholder]="pendingFile() ? 'أضف تعليقاً (اختياري)...' : 'اكتب رسالة'"
        [ngModel]="messageText()"
        (ngModelChange)="messageText.set($event)"
        (keydown.enter)="onSend()"
        (input)="onTyping()"
        dir="auto"
        autocomplete="off"
      />
    </div>

    <!-- Attachment button -->
    <label class="chat-footer__icon-btn" for="fileInput" aria-label="إرفاق ملف">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
      </svg>
    </label>
    <input #fileInputRef type="file" id="fileInput" class="chat-footer__file-input" (change)="onFileSelected($event)" />

  </div>
</div>
