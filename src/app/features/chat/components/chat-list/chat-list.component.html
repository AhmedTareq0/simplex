<div class="chat-list">
  <app-chat-list-header [accountPicture]="accountPicture()" />
  <div class="chat-list__search-row">
    <app-chat-search (search)="onSearch($event)" />
    <button class="filter-toggle" [class.active]="showFilters()" (click)="toggleFilters()">
      <i class="pi pi-filter"></i>
    </button>
  </div>

  @if (showFilters()) {
    <app-chat-filters (filterChange)="filterChange.emit($event)" />
  }

  <div class="chat-list__conversations">
    @for (user of users(); track user.sub) {
      <app-chat-conversation
        [user]="user"
        [lastMessage]="getLastMessage(user.sub)"
        [selected]="user.sub === selectedUserId()"
        [currentUserId]="currentUserId()"
        [unreadCount]="getUnreadCount(user.sub)"
        [isOnline]="isUserOnline(user.sub)"
        (select)="selectUser.emit(user)"
      />
    }
    
    @if (users().length < total()) {
      <div class="chat-list__load-more">
        <button (click)="loadMore.emit()">تحميل المزيد ({{ total() - users().length }} متبقي)</button>
      </div>
    }

    @if (users().length === 0) {
      <div class="chat-list__empty">
        لم يتم العثور على محادثات
      </div>
    }
  </div>
</div>
