<div class="chat-message-wrapper" [class.chat-message-wrapper--own]="isOwn">
  <div *ngIf="showSenderInfo && !isOwn" class="chat-message__sender">
    <img [src]="senderPicture" alt="sender" class="chat-message__sender-avatar" />
    <span class="chat-message__sender-name">{{ senderName }}</span>
  </div>
  <div class="chat-message" [class.chat-message--own]="isOwn" [class.chat-message--deleted]="isDeleted" (click)="closeDropdown()">
    <div class="chat-message__dropdown-trigger" (click)="toggleDropdown($event)">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="1"></circle>
        <circle cx="12" cy="5" r="1"></circle>
        <circle cx="12" cy="19" r="1"></circle>
      </svg>
    </div>
    <div *ngIf="showDropdown()" class="chat-message__dropdown">
      <div class="chat-message__dropdown-item" (click)="onReply()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 17 4 12 9 7"></polyline>
          <path d="M20 18v-2a4 4 0 0 0-4-4H4"></path>
        </svg>
        <span>رد</span>
      </div>
      <div *ngIf="isOwn" class="chat-message__dropdown-item" (click)="onEdit()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
        <span>تعديل</span>
      </div>
      <div class="chat-message__dropdown-item chat-message__dropdown-item--danger" (click)="onDelete()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        <span>حذف</span>
      </div>
    </div>
    <ng-container *ngIf="isDeleted">
      <span class="chat-message__deleted">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        تم حذف هذه الرسالة
      </span>
      <span class="chat-message__time">{{ formatDate(message?.createdAt) }}</span>
    </ng-container>

    <ng-container *ngIf="!isDeleted && !isFile; else fileMessage">
      <div *ngIf="isReply" class="chat-message__reply">
        <span class="chat-message__reply-label">رد على رسالة</span>
        <span class="chat-message__reply-text">{{ replyText }}</span>
      </div>
      <span class="chat-message__text">{{ message?.text }}</span>
      <span class="chat-message__time">{{ formatDate(message?.createdAt) }}</span>
    </ng-container>

    <ng-template #fileMessage>
      <div class="chat-message__file">
        <ng-container *ngIf="isPdf; else imageMessage">
          <div class="chat-message__pdf">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <span class="chat-message__pdf-name">{{ message?.text?.split('/')?.pop() || 'File' }}</span>
          </div>
        </ng-container>

        <ng-template #imageMessage>
          <img class="chat-message__image" [src]="message?.text" [alt]="message?.text" />
        </ng-template>

        <span class="chat-message__time chat-message__time--absolute">
          <svg class="chat-message__download" (click)="downloadMedia()" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          {{ formatDate(message?.createdAt) }}
        </span>
      </div>
    </ng-template>
  </div>
</div>
