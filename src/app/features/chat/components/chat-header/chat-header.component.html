<div class="chat-header">
  <div class="chat-header__avatar-wrap">
    <img
      class="chat-header__image"
      [src]="person?.picture || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'"
      [alt]="person?.name"
    />
    <span *ngIf="isOnline" class="chat-header__online-dot"></span>
  </div>

  <div class="chat-header__info">
    <span class="chat-header__name">{{ person?.name || 'غير معروف' }}</span>
    <span class="chat-header__status" [class.chat-header__status--typing]="isTyping">
      <ng-container *ngIf="isTyping; else statusText">
        <span class="chat-header__typing-dots">
          <span></span><span></span><span></span>
        </span>
        يكتب...
      </ng-container>
      <ng-template #statusText>
        {{ isOnline ? 'متصل الآن' : 'غير متصل' }}
      </ng-template>
    </span>
  </div>

  <div class="chat-header__actions">
    <button class="chat-header__action-btn" aria-label="بحث">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </button>
    <button class="chat-header__action-btn" aria-label="المزيد">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="5" r="1"></circle>
        <circle cx="12" cy="12" r="1"></circle>
        <circle cx="12" cy="19" r="1"></circle>
      </svg>
    </button>
  </div>
</div>
