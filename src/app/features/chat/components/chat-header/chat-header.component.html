<div class="chat-header">
  <img
    class="chat-header__image"
    [src]="person?.picture || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'"
    alt="display picture"
  />
  <div class="chat-header__info">
    <span class="chat-header__name">{{ person?.name || 'غير معروف' }}</span>
    <span class="chat-header__status">{{ isOnline ? 'متصل' : 'غير متصل' }}</span>
  </div>
  <div class="chat-header__actions">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="1"></circle>
      <circle cx="12" cy="5" r="1"></circle>
      <circle cx="12" cy="19" r="1"></circle>
    </svg>
  </div>
</div>
