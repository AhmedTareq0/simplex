<header class="chat-header">
  <div class="chat-header__info">
    <div class="chat-header__avatar-wrap">
      <img
        class="chat-header__image"
        [src]="person?.picture || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'"
        [alt]="person?.name"
      />
      @if (isOnline) {
        <span class="chat-header__online-dot"></span>
      }
    </div>
    <div class="chat-header__text">
      <h3 class="chat-header__name">{{ person?.name || 'غير معروف' }}</h3>
      <p class="chat-header__status">
        @if (isTyping) {
          <span class="chat-header__typing">يكتب...</span>
        } @else {
          {{ isOnline ? 'متصل الآن' : 'غير متصل' }}
        }
      </p>
    </div>
  </div>

  <div class="chat-header__actions">
    <button class="chat-header__action-btn" aria-label="بحث">
      <app-icon name="search" size="sm" />
    </button>
    
    <div class="chat-header__menu-wrap">
      <button class="chat-header__action-btn" aria-label="المزيد" (click)="toggleMenu()">
        <app-icon name="moreVertical" size="sm" />
      </button>

      @if (showMenu()) {
        <div class="chat-header__dropdown">
          <div class="chat-header__dropdown-backdrop" (click)="showMenu.set(false)"></div>
          <div class="chat-header__dropdown-content">
            <button class="chat-header__dropdown-item" (click)="requestVisit()">
              <app-icon name="calendarPlus" size="sm" />
              <span>Need Visit</span>
            </button>
            <!-- Assign engineer / End conversation removed -->
          </div>
        </div>
      }
    </div>
  </div>
</header>
