<div class="chat-box">
  <app-chat-header
    [person]="person()"
    [isOnline]="isOnline()"
    [isTyping]="isTyping()"
    [conversationId]="conversationId()"
    [status]="person()?.status"
    (deleted)="deleted.emit($event)"
    (back)="back.emit()"
  />
  <app-chat-messages
    [messages]="messages()"
    [currentUserId]="currentUserId()"
    [conversationId]="conversationId()"
    [userName]="userName()"
    [users]="users()"
  />
</div>
