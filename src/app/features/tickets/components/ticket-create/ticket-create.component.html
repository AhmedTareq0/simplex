<app-shared-modal
  [(visible)]="visible"
  [title]="isEditMode ? 'تعديل التذكرة #' + (editData?.id || '') : 'إنشاء تذكرة جديدة'"
  [maxWidth]="'32rem'"
  (closed)="close()"
>
  <div class="ticket-create__form">
    @if (!isEditMode) {
      <app-shared-select
        label="العميل *"
        [options]="clientOptions()"
        [(ngModel)]="formData.customer_id"
        optionLabel="label"
        optionValue="value"
        placeholder="اختر العميل"
        [showClear]="true"
        [filter]="true"
        class="ticket-create__field"
      ></app-shared-select>
    }

    @if (!isEditMode) {
      <app-shared-input
        label="العنوان *"
        type="text"
        [(ngModel)]="formData.title"
        placeholder="أدخل عنوان التذكرة"
        class="ticket-create__field"
      ></app-shared-input>
    }

    @if (!isEditMode) {
      <app-shared-select
        label="الماكينة *"
        [options]="machineOptions()"
        [(ngModel)]="formData.machine_id"
        optionLabel="label"
        optionValue="value"
        placeholder="اختر الماكينة"
        [showClear]="true"
        [filter]="true"
        class="ticket-create__field"
      ></app-shared-select>
    }

    <app-shared-select
      label="المهندس المسؤول"
      [options]="engineerOptions()"
      [(ngModel)]="formData.engineer_id"
      optionLabel="label"
      optionValue="value"
      placeholder="تعيين مهندس"
      [showClear]="true"
      [filter]="true"
      class="ticket-create__field"
    ></app-shared-select>

    @if (isEditMode) {
      <app-shared-input
        label="تاريخ الزيارة المتوقع"
        type="date"
        [(ngModel)]="formData.visit_date"
        class="ticket-create__field"
      ></app-shared-input>
    }

    <div class="ticket-create__row">
      <app-shared-select
        label="الأولوية"
        [options]="priorityOptions"
        [(ngModel)]="formData.priority"
        optionLabel="label"
        optionValue="value"
        placeholder="اختر الأولوية"
        [showClear]="false"
        class="ticket-create__field"
      ></app-shared-select>

      @if (isEditMode) {
        <app-shared-select
          label="الحالة"
          [options]="statusOptions"
          [(ngModel)]="formData.status"
          optionLabel="label"
          optionValue="value"
          placeholder="اختر الحالة"
          [showClear]="false"
          class="ticket-create__field"
        ></app-shared-select>
      }
    </div>

    @if (errorMessage()) {
      <div class="ticket-create__error">{{ errorMessage() }}</div>
    }

    <div class="ticket-create__actions">
      <button class="ticket-create__btn ticket-create__btn--secondary" (click)="close()">
        إلغاء
      </button>
      <button
        class="ticket-create__btn ticket-create__btn--primary"
        (click)="onSave()"
        [disabled]="isSaving()"
      >
        @if (isSaving()) {
          جاري الحفظ...
        } @else if (isEditMode) {
          حفظ التعديلات
        } @else {
          إنشاء التذكرة
        }
      </button>
    </div>
  </div>
</app-shared-modal>
