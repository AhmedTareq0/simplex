<app-shared-modal
  [(visible)]="visible"
  [title]="isEditMode ? 'تعديل التذكرة' : 'إنشاء تذكرة جديدة'"
  [maxWidth]="'32rem'"
  (closed)="close()"
>
  <div class="ticket-create__form">
    <app-shared-input
      label="العنوان"
      type="text"
      [(ngModel)]="newTicket.name"
      placeholder="أدخل عنوان التذكرة"
      class="ticket-create__field"
    ></app-shared-input>

    <app-shared-input
      label="المكنة"
      type="text"
      [(ngModel)]="newTicket.machine"
      placeholder="أدخل رقم المكنة"
      class="ticket-create__field"
    ></app-shared-input>

    <app-shared-input
      label="تاريخ الزيارة"
      type="date"
      [(ngModel)]="newTicket.visitDate"
      class="ticket-create__field"
    ></app-shared-input>

    <app-shared-select
      label="الحالة"
      [options]="statusOptions"
      [(ngModel)]="newTicket.status"
      optionLabel="label"
      optionValue="value"
      placeholder="اختر الحالة"
      [showClear]="false"
      class="ticket-create__field"
    ></app-shared-select>

    <app-shared-select
      label="الأولوية"
      [options]="priorityOptions"
      [(ngModel)]="newTicket.priority"
      optionLabel="label"
      optionValue="value"
      placeholder="اختر الأولوية"
      [showClear]="false"
      class="ticket-create__field"
    ></app-shared-select>

    <div class="ticket-create__actions">
      <button class="ticket-create__btn ticket-create__btn--secondary" (click)="close()">
        إلغاء
      </button>
      <button class="ticket-create__btn ticket-create__btn--primary" (click)="onSave()">
        حفظ
      </button>
    </div>
  </div>
</app-shared-modal>
