<div class="tickets">
  <div class="tickets__header">
    <div class="tickets__info">
      <h1 class="tickets__title">التذاكر</h1>
      <p class="tickets__subtitle">إدارة تذاكر دعم العملاء</p>
    </div>
    <div class="tickets__actions">
      @if (auth.hasPermission('tickets.create')) {
        <app-button
          label="إنشاء تذكرة"
          icon="plus"
          (pressed)="showCreate.set(true)"
        />
      }
    </div>
  </div>

  @if (isLoading) {
    <div class="tickets__skeleton">
      <app-skeleton-loader type="table" [count]="8" />
    </div>
  } @else {
    <app-shared-table
      [data]="mappedTickets()"
      [columns]="columns"
      title="قائمة التذاكر"
      [showView]="false"
      [showEdit]="false"
      [showDelete]="false"
      [showActions]="false"
      [lazy]="true"
      [totalRecords]="total"
      [rows]="pageSize()"
      [currentPage]="currentPage()"
      [showSync]="auth.hasPermission('sync.manage')"
      [isSyncing]="isSyncing()"
      (onSync)="onSync()"
      (onPageChange)="onPageChange($event)"
      (onRowClick)="onRowClick($event)"
      (onAction)="onTableAction($event)"
    />
  }
</div>

<app-ticket-detail
  [(visible)]="showDetail"
  [ticket]="selectedTicket()"
  (updated)="onTicketUpdated($event)"
  (edit)="onEditTicket($event)"
/>

<app-ticket-create
  [(visible)]="showCreate"
  (created)="onTicketCreated()"
/>

<app-ticket-create
  [(visible)]="showEdit"
  [isEditMode]="true"
  [editData]="editTicket()"
  (updated)="onTicketEditUpdated($event)"
/>
