<div class="modal-overlay" (click)="cancel.emit()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-header__info">
        <h3>تعديل بيانات الماكينة</h3>
      </div>
      <button class="modal-close" (click)="cancel.emit()">
        <app-icon name="close" size="sm" />
      </button>
    </div>

    <form [formGroup]="editForm" (ngSubmit)="onSubmit()" class="modal-form">
      <div class="form-grid">
        <!-- Name -->
        <div class="form-group form-group--full">
          <label for="name">اسم الماكينة</label>
          <input id="name" type="text" pInputText formControlName="name" placeholder="أدخل الاسم..." />
        </div>

        <!-- Category -->
        <div class="form-group">
          <label for="categoryId">الفئة</label>
          <p-inputNumber id="categoryId" formControlName="categoryId" [min]="1" />
        </div>

        <!-- Price -->
        <div class="form-group">
          <label for="price">السعر</label>
          <p-inputNumber id="price" formControlName="price" [min]="0" mode="currency" currency="EGP"
            locale="ar-SA" />
        </div>
      </div>

      <!-- Descriptions -->
      <div class="form-group">
        <label for="desc">الوصف</label>
        <textarea id="desc" pTextarea formControlName="description" rows="3" placeholder="وصف الماكينة..."></textarea>
      </div>

      <!-- File Uploads -->
      <div class="files-grid">
        <!-- Image -->
        <div class="file-upload">
          <label>صورة المنتج</label>
          <div class="file-upload__box" (click)="imgInput.click()">
            @if (imagePreview()) {
              <img [src]="imagePreview()" alt="preview" class="file-upload__preview" />
            } @else {
              <div class="file-upload__placeholder">
                <app-icon name="camera" size="md" />
                <span>اضغط لرفع صورة</span>
              </div>
            }
            <input #imgInput type="file" (change)="onImageSelected($event)" accept="image/*" hidden />
          </div>
        </div>

        <!-- Document -->
        <div class="file-upload">
          <label>الكتالوج (.docx)</label>
          <div class="file-upload__box" [class.file-upload__box--has-file]="selectedDocument" (click)="docInput.click()">
            <div class="file-upload__placeholder">
              <app-icon [name]="selectedDocument ? 'check-circle' : 'fileAlt'" size="md" [class.success]="selectedDocument" />
              <span>{{ selectedDocument ? selectedDocument.name : 'اضغط لرفع الكتالوج' }}</span>
            </div>
            <input #docInput type="file" (change)="onDocumentSelected($event)" accept=".docx" hidden />
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-cancel" (click)="cancel.emit()">إلغاء</button>
        <button type="submit" class="btn-save" [disabled]="editForm.invalid">حفظ التغييرات</button>
      </div>
    </form>
  </div>
</div>
