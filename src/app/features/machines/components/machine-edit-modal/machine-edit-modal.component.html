<app-shared-modal
  [visible]="visible()"
  [title]="machine().id === 0 ? 'إضافة ماكينة جديدة' : 'تعديل بيانات الماكينة'"
  (visibleChange)="cancel.emit()"
>
  <form [formGroup]="editForm" (ngSubmit)="onSubmit()" class="machine-form">
    <div class="machine-form__media">
      <button
        type="button"
        class="machine-form__preview"
        (click)="imageInput.click()"
        aria-label="اختيار صورة الماكينة"
      >
        @if (imagePreview()) {
          <img [src]="imagePreview()" alt="صورة الماكينة" class="machine-form__img" />
        } @else {
          <span class="machine-form__placeholder">
            <app-icon name="image" size="lg" />
            <span>اختيار صورة</span>
          </span>
        }
      </button>
      <div class="machine-form__media-copy">
        <h3>صورة الماكينة</h3>
        <p>ارفع صورة واضحة للماكينة. يمكن تركها كما هي أثناء التعديل.</p>
        <button type="button" class="machine-form__file-btn" (click)="imageInput.click()">
          <app-icon name="image" size="sm" />
          <span>رفع صورة</span>
        </button>
      </div>
      <input
        #imageInput
        type="file"
        class="machine-form__hidden"
        accept="image/*"
        (change)="onImageSelected($event)"
      />
    </div>

    <div class="machine-form__grid">
      <app-shared-input
        label="اسم الماكينة"
        formControlName="name"
        placeholder="مثال: CNC Router X1"
        [required]="true"
        [error]="getErrorMessage('name')"
      />

      <app-shared-select
        label="الفئة"
        formControlName="categoryId"
        [options]="categoryOptions"
        [required]="true"
        placeholder="اختر الفئة"
        [error]="getErrorMessage('categoryId')"
      />

      <app-shared-select
        label="نوع المنتج"
        formControlName="type"
        [options]="typeOptions"
        [required]="true"
        [error]="getErrorMessage('type')"
      />

      <app-shared-input
        label="السعر"
        type="number"
        formControlName="price"
        placeholder="0.00"
        [required]="true"
        [error]="getErrorMessage('price')"
      />
    </div>

    <div class="machine-form__grid">
      <app-shared-input
        label="رقم الموديل"
        formControlName="model_number"
        placeholder="مثال: SLX-2025"
      />
      <app-shared-input
        label="الرقم التسلسلي"
        formControlName="serial_number"
        placeholder="أدخل الرقم التسلسلي..."
      />
      <app-shared-input
        label="فترة الضمان (بالأشهر)"
        type="number"
        formControlName="warranty_period"
        placeholder="مثال: 12"
      />
      <app-shared-input
        label="بلد المنشأ"
        formControlName="origin_country"
        placeholder="مثال: مصر، ألمانيا..."
      />
    </div>

    <div class="machine-form__full">
      <app-shared-input
        label="وصف المبيعات (يظهر للعملاء)"
        formControlName="description_sale"
        placeholder="أدخل الوصف الذي سيظهر في الموقع والكتالوج"
        [error]="getErrorMessage('description_sale')"
      />
    </div>

    <div class="machine-form__full">
      <app-shared-input
        label="وصف داخلي (ملاحظات)"
        formControlName="description"
        placeholder="أدخل ملاحظات فنية أو داخلية"
        [error]="getErrorMessage('description')"
      />
    </div>

    <div class="machine-form__full">
      <app-shared-input
        label="المواصفات الفنية التفصيلية"
        formControlName="technical_specs"
        placeholder="أدخل المواصفات التقنية (أبعاد، قدرة، إلخ)..."
      />
    </div>

    <div class="machine-form__status">
      <label class="machine-form__status-toggle">
        <input type="checkbox" formControlName="active" />
        <span class="machine-form__status-label">ماكينة نشطة (تظهر في الموقع للعملاء)</span>
      </label>
    </div>

    <div class="machine-form__upload">
      <div>
        <label class="machine-form__label">كتالوج الماكينة</label>
        <p class="machine-form__hint">ملف Word بصيغة .docx فقط</p>
      </div>
      <button type="button" class="machine-form__file-drop" (click)="docInput.click()">
        <app-icon name="fileAlt" size="sm" />
        <span>{{ selectedDocument ? selectedDocument.name : 'اختر ملف الوورد' }}</span>
      </button>
      <input
        #docInput
        type="file"
        class="machine-form__hidden"
        accept=".docx"
        (change)="onDocumentSelected($event)"
      />
    </div>

    <div class="machine-form__actions">
      <app-button
        type="button"
        label="إلغاء"
        variant="secondary"
        (pressed)="cancel.emit()"
      />
      <app-button
        type="submit"
        [label]="machine().id === 0 ? 'إضافة الماكينة' : 'حفظ التعديلات'"
        [loading]="isSubmitting()"
      />
    </div>
  </form>
</app-shared-modal>
