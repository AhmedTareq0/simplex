<p-dialog
  [visible]="visible"
  (visibleChange)="handleVisibleChange($event)"
  [modal]="true"
  [closable]="false"
  [draggable]="false"
  [resizable]="resizable"
  [closeOnEscape]="closeOnEscape"
  [dismissableMask]="dismissible"
  [showHeader]="false"
  [blockScroll]="true"
  appendTo="body"
  maskStyleClass="app-shared-modal-mask"
  [style]="{ width: width, maxWidth: maxWidth }"
  [pt]="{
    root: { class: 'app-shared-modal-dialog rounded-2xl border border-[var(--color-border)] bg-[var(--color-card-bg)] shadow-[var(--shadow-xl)] overflow-hidden' },
    content: { class: 'app-shared-modal-content p-0 bg-transparent' }
  }"
>
  <div class="flex flex-col max-h-[min(85vh,48rem)] bg-[var(--color-card-bg)] text-[var(--color-text-primary)]">
    @if (title || showCloseButton) {
      <div class="flex items-center justify-between gap-4 px-6 py-5 border-b border-[var(--color-border)]">
        <div class="min-w-0">
          @if (title) {
            <h3 class="m-0 font-[var(--font-heading)] text-xl font-[var(--font-weight-bold)] leading-[var(--line-height-tight)]">
              {{ title }}
            </h3>
          }
        </div>

        @if (showCloseButton) {
          <p-button
            severity="secondary"
            [text]="true"
            [rounded]="true"
            (click)="close()"
            styleClass="!w-10 !h-10 !min-h-0 !border !border-[var(--color-border)] !bg-[var(--color-surface)] !text-[var(--color-text-secondary)] hover:!bg-[var(--color-primary-50)] hover:!border-[var(--color-primary-200)] hover:!text-[var(--color-primary-700)]"
            ariaLabel="Close dialog"
          >
            <ng-template pTemplate="content">
              <app-icon name="close" size="md" />
            </ng-template>
          </p-button>
        }
      </div>
    }

    <div class="app-shared-modal__body overflow-auto p-6" [class]="contentClass">
      <ng-content />
    </div>
  </div>
</p-dialog>
